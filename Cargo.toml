[package]
name = "easy-gcalendar"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
reqwest = { version = "0.13.4", features = ["json", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
yup-oauth2 = "12.1.2"
urlencoding = "2.1.3"
thiserror = "2.0.20"
